<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>设置向导 - MikanDown</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js" defer></script>
  <style>
    :root {
      --bg: #f0f6ff;
      --card: #ffffff;
      --text: #1e3a5f;
      --text-2: #64748b;
      --text-3: #94a3b8;
      --primary: #3b82f6;
      --primary-deep: #2563eb;
      --accent: #60a5fa;
      --grad-deep: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      --success: #34d399;
      --danger: #f87171;
    }

    * { font-family: "M PLUS Rounded 1c", "Varela Round", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif; }

    body {
      margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh;
      background:
        radial-gradient(circle at 12% 18%, rgba(249, 168, 212, 0.22) 0%, transparent 42%),
        radial-gradient(circle at 88% 12%, rgba(196, 181, 253, 0.26) 0%, transparent 40%),
        radial-gradient(circle at 72% 88%, rgba(254, 215, 170, 0.20) 0%, transparent 42%),
        linear-gradient(160deg, #f0f6ff 0%, #e8f1ff 55%, #f0f6ff 100%);
      background-attachment: fixed;
      color: var(--text);
    }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        radial-gradient(circle 2px at 8% 22%, rgba(59,130,246,.35) 100%, transparent),
        radial-gradient(circle 2px at 22% 74%, rgba(96,165,250,.40) 100%, transparent),
        radial-gradient(circle 1.6px at 38% 12%, rgba(59,130,246,.30) 100%, transparent),
        radial-gradient(circle 2.2px at 55% 64%, rgba(251,191,36,.35) 100%, transparent),
        radial-gradient(circle 1.6px at 68% 30%, rgba(52,211,153,.35) 100%, transparent),
        radial-gradient(circle 2px at 84% 52%, rgba(96,165,250,.35) 100%, transparent),
        radial-gradient(circle 1.6px at 92% 84%, rgba(59,130,246,.30) 100%, transparent);
    }

    /* ===== 马卡龙海报墙 ===== */
    .poster-wall { position: fixed; inset: 0; overflow: hidden; z-index: -1; opacity: 0.5; }
    .poster-wall-inner { width: 160%; height: 160%; position: absolute; top: -30%; left: -30%; transform: rotate(-8deg) scale(1.4); filter: blur(10px); }
    .poster-wall-scroll { width: 100%; animation: scrollBg 40s linear infinite; }
    .pw-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
    .poster-tile { aspect-ratio: 2 / 3; border-radius: 10px; }
    @keyframes scrollBg { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }
    @media (prefers-reduced-motion: reduce) { .poster-wall-scroll { animation: none !important; } }

    /* ===== 步骤指示器 ===== */
    .step-indicator { display: flex; justify-content: center; align-items: center; gap: 0; margin-bottom: 2rem; }
    .step-dot { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 800; background: #dbeafe; color: #64748b; transition: all 0.3s; }
    .step-dot.active { background: var(--grad-deep); color: #fff; box-shadow: 0 4px 14px rgba(37,99,235,0.45); }
    .step-dot.done { background: linear-gradient(135deg, #93c5fd, #93c5fd); color: #fff; }
    .step-line { width: 60px; height: 3px; background: #dbeafe; border-radius: 999px; transition: background 0.3s; }
    .step-line.done { background: linear-gradient(135deg, #93c5fd, #93c5fd); }
    .step-content { display: none; }
    .step-content.active { display: block; }

    /* ===== 白色毛玻璃向导卡片 ===== */
    .glass-wizard {
      position: relative; z-index: 1;
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1.5px solid rgba(59, 130, 246, 0.18);
      border-radius: 22px; padding: 2.5rem;
      box-shadow: 0 18px 50px rgba(59, 130, 246, 0.16);
      width: 100%; max-width: 520px;
    }
    .glass-wizard h3 { color: var(--text); font-size: 1.2rem; margin: 0 0 0.25rem 0; }
    .glass-wizard p { color: var(--text-2); font-size: 0.85rem; margin: 0 0 1.2rem 0; }
    .glass-wizard input {
      background: #f0f6ff; border: 1.5px solid rgba(59, 130, 246, 0.2);
      border-radius: 12px; padding: 0.7rem 0.9rem; color: var(--text);
      font-size: 0.85rem; outline: none; width: 100%; box-sizing: border-box; margin-bottom: 0.7rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .glass-wizard input::placeholder { color: var(--text-3); }
    .glass-wizard input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.14); }
    .btn-group { display: flex; justify-content: space-between; margin-top: 1.5rem; gap: 0.5rem; }
    .btn-group .btn-primary {
      background: var(--grad-deep); color: #fff; border: none; border-radius: 12px;
      padding: 0.58rem 1.2rem; font-weight: 700; font-size: 0.85rem; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-group .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37,99,235,0.35); }
    .btn-group .btn-secondary {
      background: #dbeafe; color: var(--text); border: 1.5px solid rgba(59, 130, 246, 0.2);
      border-radius: 12px; padding: 0.5rem 1rem; font-size: 0.85rem; font-weight: 600; cursor: pointer;
      transition: background 0.15s;
    }
    .btn-group .btn-secondary:hover { background: #c7dcff; }
    .result-msg { margin-top: 0.5rem; font-size: 0.85rem; font-weight: 600; }
    .result-msg.success { color: #10b981; }
    .result-msg.error { color: #ef4444; }
  </style>
</head>
<body>
  <!-- 马卡龙海报墙 -->
  <div class="poster-wall">
    <div class="poster-wall-inner">
      <div class="poster-wall-scroll">
        <div class="pw-grid">
          <div class="poster-tile" style="background:linear-gradient(135deg,#93c5fd,#3b82f6)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#60a5fa,#93c5fd)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#93c5fd,#bfdbfe)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#86efac,#bbf7d0)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#fcd34d,#fde68a)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#93c5fd,#3b82f6)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#93c5fd,#bfdbfe)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#60a5fa,#93c5fd)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#86efac,#bbf7d0)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#93c5fd,#3b82f6)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#60a5fa,#93c5fd)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#fcd34d,#fde68a)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#93c5fd,#bfdbfe)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#86efac,#bbf7d0)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#93c5fd,#3b82f6)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#93c5fd,#bfdbfe)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#fcd34d,#fde68a)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#93c5fd,#bfdbfe)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#60a5fa,#93c5fd)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#93c5fd,#3b82f6)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#86efac,#bbf7d0)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#fcd34d,#fde68a)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#93c5fd,#bfdbfe)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#60a5fa,#93c5fd)"></div>
        </div>
        <div class="pw-grid">
          <div class="poster-tile" style="background:linear-gradient(135deg,#93c5fd,#3b82f6)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#60a5fa,#93c5fd)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#93c5fd,#bfdbfe)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#86efac,#bbf7d0)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#fcd34d,#fde68a)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#93c5fd,#3b82f6)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#93c5fd,#bfdbfe)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#60a5fa,#93c5fd)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#86efac,#bbf7d0)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#93c5fd,#3b82f6)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#60a5fa,#93c5fd)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#fcd34d,#fde68a)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#93c5fd,#bfdbfe)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#86efac,#bbf7d0)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#93c5fd,#3b82f6)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#93c5fd,#bfdbfe)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#fcd34d,#fde68a)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#93c5fd,#bfdbfe)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#60a5fa,#93c5fd)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#93c5fd,#3b82f6)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#86efac,#bbf7d0)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#fcd34d,#fde68a)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#93c5fd,#bfdbfe)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#60a5fa,#93c5fd)"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="glass-wizard">
    <div style="text-align:center;margin-bottom:1.5rem;">
      <div style="font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,#3b82f6 0%,#2563eb 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">🌸 MikanDown</div>
      <p style="color:#64748b;font-size:0.8rem;margin:0.2rem 0 0 0;">🎉 几步完成初始设置</p>
    </div>

    <div class="step-indicator">
      <div class="step-dot active" id="sd-1">1</div><div class="step-line" id="sl-1"></div>
      <div class="step-dot" id="sd-2">2</div><div class="step-line" id="sl-2"></div>
      <div class="step-dot" id="sd-3">3</div>
    </div>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="alert alert-danger">{{ messages[0] }}</div>
    {% endif %}
    {% endwith %}

    <!-- Step 1 -->
    <div class="step-content active" id="step-1">
      <h3>设置管理员账户</h3>
      <p>创建你的管理员用户名和密码</p>
      <form id="form-step1" method="post" action="{{ url_for('setup') }}">
        <input type="text" name="username" placeholder="管理员用户名" required>
        <input type="password" name="password" placeholder="设置密码" required>
        <input type="password" name="password_confirm" placeholder="确认密码" required>
        <div class="btn-group"><span></span><button type="submit" class="btn-primary">下一步 →</button></div>
      </form>
    </div>

    <!-- Step 2 -->
    <div class="step-content" id="step-2">
      <h3>连接 qBittorrent</h3>
      <p>填入 qBittorrent Web UI 的连接信息</p>
      <form id="form-step2">
        <input type="text" id="qbit_host" placeholder="qBittorrent 地址 (如 192.168.1.100)" required>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;">
          <input type="text" id="qbit_port" placeholder="端口 (默认 8080)" value="8080" required>
          <input type="text" id="qbit_user" placeholder="用户名 (默认 admin)" value="admin">
        </div>
        <input type="password" id="qbit_pass" placeholder="密码">
        <input type="text" id="qbit_path" placeholder="保存路径 (如 /downloads/)" value="/downloads/">
        <div id="qbit-result" class="result-msg"></div>
        <div class="btn-group">
          <button type="button" class="btn-secondary" onclick="goStep(1)">← 上一步</button>
          <button type="submit" class="btn-primary">测试连接并继续 →</button>
        </div>
      </form>
    </div>

    <!-- Step 3 -->
    <div class="step-content" id="step-3">
      <h3>添加你的第一个订阅（可选）</h3>
      <p>输入 Mikan Project 的 RSS 订阅链接，或跳过稍后添加</p>
      <form id="form-step3">
        <input type="url" id="rss_url" placeholder="RSS URL (右键 MikanProject 复制链接地址)">
        <div id="rss-result" class="result-msg"></div>
        <div class="btn-group">
          <button type="button" class="btn-secondary" onclick="goStep(2)">← 上一步</button>
          <button type="button" class="btn-secondary" id="skip-step3" onclick="window.location.href='/'">跳过</button>
          <button type="submit" class="btn-primary">测试并完成</button>
        </div>
      </form>
    </div>

    <p id="wizard-done" style="display:none;text-align:center;color:#10b981;font-size:0.9rem;font-weight:600;">
      ✅ 设置完成！<a href="{{ url_for('index') }}" style="color:#2563eb;text-decoration:none;font-weight:700;">进入主界面</a>
    </p>
  </div>

<script>
let currentStep = 1;
function goStep(n) {
  document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
  document.getElementById('step-' + n).classList.add('active');
  document.querySelectorAll('.step-dot').forEach(el => el.classList.remove('active'));
  document.getElementById('sd-' + n).classList.add('active');
  document.querySelectorAll('.step-line').forEach(el => el.classList.remove('done'));
  for (let i = 1; i < n; i++) {
    document.getElementById('sd-' + i).classList.add('done');
    document.getElementById('sd-' + i).classList.remove('active');
    document.getElementById('sl-' + i).classList.add('done');
  }
  currentStep = n;
}

(async function initWizard() {
  const res = await fetch('/api/status');
  const data = await res.json();
  if (data.auth_set && data.qbit_set) {
    window.location.href = '/';
    return;
  }
  if (data.auth_set) {
    goStep(2);
  }
})();

document.getElementById('form-step2')?.addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = this.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = '测试中...';
  const res = await fetch('/api/test_qbit', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({
    host: document.getElementById('qbit_host').value,
    port: document.getElementById('qbit_port').value,
    username: document.getElementById('qbit_user').value,
    password: document.getElementById('qbit_pass').value
  })});
  const data = await res.json();
  const resultEl = document.getElementById('qbit-result');
  if (data.success) {
    const saveRes = await fetch('/update_qbit_settings', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: new URLSearchParams({
      qbit_host: document.getElementById('qbit_host').value,
      qbit_port: document.getElementById('qbit_port').value,
      qbit_username: document.getElementById('qbit_user').value,
      qbit_password: document.getElementById('qbit_pass').value,
      qbit_save_path: document.getElementById('qbit_path').value
    })});
    const saveData = await saveRes.json();
    if (saveData.success) {
      resultEl.className = 'result-msg success'; resultEl.textContent = '✅ 连接成功 (v' + data.version + ')，已保存配置';
      setTimeout(() => goStep(3), 800);
    }
  } else {
    resultEl.className = 'result-msg error'; resultEl.textContent = '❌ ' + (data.message || '连接失败');
  }
  btn.disabled = false; btn.textContent = '测试连接并继续';
});

document.getElementById('form-step3')?.addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = this.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = '验证中...';
  const formData = new FormData(); formData.append('rss_url', document.getElementById('rss_url').value);
  const res = await fetch('/api/preview_feed', {method:'POST', body: formData});
  const data = await res.json();
  const resultEl = document.getElementById('rss-result');
  if (data.success) {
    const addRes = await fetch('/add', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
      url: document.getElementById('rss_url').value,
      title: data.title,
      filters: {include: '', exclude: ''}
    })});
    const addData = await addRes.json();
    if (addData.success) {
      resultEl.className = 'result-msg success';
      resultEl.textContent = '✅ 已添加: ' + data.title;
      document.getElementById('form-step3').style.display = 'none';
      document.getElementById('wizard-done').style.display = 'block';
    } else {
      resultEl.className = 'result-msg error'; resultEl.textContent = '❌ ' + (addData.message || '添加失败');
    }
  } else {
    resultEl.className = 'result-msg error'; resultEl.textContent = '❌ ' + (data.message || '验证失败');
  }
  btn.disabled = false; btn.textContent = '测试并完成';
});
</script>
</body>
</html>
