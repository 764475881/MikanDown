<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>登录 - MikanDown</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js" defer></script>
  <style>
    :root {
      --bg: #fdf2f8;
      --card: #ffffff;
      --text: #4c3a55;
      --text-2: #9b8ba8;
      --primary: #f472b6;
      --primary-deep: #ec4899;
      --accent: #a78bfa;
      --grad-deep: linear-gradient(135deg, #f472b6 0%, #8b5cf6 100%);
    }

    * { font-family: "M PLUS Rounded 1c", "Varela Round", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif; }

    /* ===== 粉紫渐变背景 + 漂浮小星星 ===== */
    body {
      margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh;
      background:
        radial-gradient(circle at 12% 18%, rgba(249, 168, 212, 0.22) 0%, transparent 42%),
        radial-gradient(circle at 88% 12%, rgba(196, 181, 253, 0.26) 0%, transparent 40%),
        radial-gradient(circle at 72% 88%, rgba(254, 215, 170, 0.20) 0%, transparent 42%),
        linear-gradient(160deg, #fdf2f8 0%, #f5f3ff 55%, #fdf2f8 100%);
      background-attachment: fixed;
      color: var(--text);
    }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        radial-gradient(circle 2px at 8% 22%, rgba(244,114,182,.35) 100%, transparent),
        radial-gradient(circle 2px at 22% 74%, rgba(167,139,250,.40) 100%, transparent),
        radial-gradient(circle 1.6px at 38% 12%, rgba(244,114,182,.30) 100%, transparent),
        radial-gradient(circle 2.2px at 55% 64%, rgba(251,191,36,.35) 100%, transparent),
        radial-gradient(circle 1.6px at 68% 30%, rgba(52,211,153,.35) 100%, transparent),
        radial-gradient(circle 2px at 84% 52%, rgba(167,139,250,.35) 100%, transparent),
        radial-gradient(circle 1.6px at 92% 84%, rgba(244,114,182,.30) 100%, transparent);
    }

    /* ===== 马卡龙海报墙（粉紫浅色） ===== */
    .poster-wall { position: fixed; inset: 0; overflow: hidden; z-index: -1; opacity: 0.5; }
    .poster-wall-inner { width: 160%; height: 160%; position: absolute; top: -30%; left: -30%; transform: rotate(-8deg) scale(1.4); filter: blur(10px); }
    .poster-wall-scroll { width: 100%; animation: scrollBg 40s linear infinite; }
    .pw-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
    .poster-tile { aspect-ratio: 2 / 3; border-radius: 10px; }
    @keyframes scrollBg { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }
    @media (prefers-reduced-motion: reduce) { .poster-wall-scroll { animation: none !important; } }

    /* ===== 白色毛玻璃卡片 ===== */
    .glass-card {
      position: relative; z-index: 1;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1.5px solid rgba(244, 114, 182, 0.18);
      border-radius: 22px;
      padding: 2.6rem;
      box-shadow: 0 18px 50px rgba(244, 114, 182, 0.16);
      width: 100%; max-width: 440px;
    }
    .glass-card .gradient-logo {
      font-size: 2rem; font-weight: 800;
      background: linear-gradient(135deg, #f472b6 0%, #8b5cf6 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .glass-card input {
      background: #fdf2f8; border: 1.5px solid rgba(244, 114, 182, 0.2);
      border-radius: 12px; padding: 0.7rem 0.9rem; color: var(--text);
      font-size: 0.85rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%; box-sizing: border-box;
    }
    .glass-card input::placeholder { color: #cbb9d8; }
    .glass-card input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(244, 114, 182, 0.14); }
    .glass-card .btn-primary {
      width: 100%; margin-top: 1.2rem;
      background: var(--grad-deep); color: #fff; border: none; border-radius: 12px;
      padding: 0.72rem; font-weight: 700; font-size: 0.9rem; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .glass-card .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(236, 72, 153, 0.35); }
  </style>
</head>
<body>
  <!-- 马卡龙海报墙 -->

    <div class="poster-wall-inner">
      <div class="poster-wall-scroll">
        <div class="pw-grid">
          <div class="poster-tile" style="background:linear-gradient(135deg,#f9a8d4,#f472b6)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#a78bfa,#c4b5fd)"></div>

          <div class="poster-tile" style="background:linear-gradient(135deg,#86efac,#bbf7d0)"></div>

          <div class="poster-tile" style="background:linear-gradient(135deg,#86efac,#bbf7d0)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#f9a8d4,#f472b6)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#93c5fd,#bfdbfe)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#fcd34d,#fde68a)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#93c5fd,#bfdbfe)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#a78bfa,#c4b5fd)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#f9a8d4,#f472b6)"></div>

          <div class="poster-tile" style="background:linear-gradient(135deg,#93c5fd,#bfdbfe)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#86efac,#bbf7d0)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#f9a8d4,#f472b6)"></div>

          <div class="poster-tile" style="background:linear-gradient(135deg,#f9a8d4,#f472b6)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#86efac,#bbf7d0)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#fcd34d,#fde68a)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#93c5fd,#bfdbfe)"></div>
          <div class="poster-tile" style="background:linear-gradient(135deg,#a78bfa,#c4b5fd)"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="glass-card">
    <div style="text-align:center;margin-bottom:1.5rem;">
      <div class="gradient-logo">🌸 MikanDown</div>
      <p style="color:#9b8ba8;font-size:0.8rem;margin:0.3rem 0 0 0;">番剧 RSS 自动下载器</p>
    </div>
    <h3 style="color:#4c3a55;font-size:1rem;margin:0 0 1rem 0;">登录</h3>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="alert alert-danger" role="alert">{{ messages[0] }}</div>
    {% endif %}
    {% endwith %}

    <form method="post" style="display:flex;flex-direction:column;gap:0.7rem;">
      <input type="text" name="username" placeholder="用户名" required>
      <input type="password" name="password" placeholder="密码" required>
      <button type="submit" class="btn-primary">登录</button>
    </form>
    <p style="text-align:center;margin-top:1rem;font-size:0.75rem;color:#9b8ba8;">
      还没有账户？<a href="/setup" style="color:#ec4899;text-decoration:none;font-weight:600;">立即创建</a>
    </p>
  </div>
</body>
</html>
