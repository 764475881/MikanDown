[project]
name = "mikandown"
version = "0.1.0"
description = "MikanDown - 自动追番下载工具"
requires-python = ">=3.10"

dependencies = [
    "Flask>=3.0",
    "Flask-APScheduler>=1.13",
    "qbittorrent-api>=2024",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "curl-cffi>=0.7",
    "gunicorn>=22.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "backend_script", "notifier", "bangumi_api"]
